<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Pomodoro</title>
</head>


<body>

    <div class="grid-container-music">
        <div class="box-black" style="grid-area: box-2;">
        </div>
    </div>



    <hr class="thick-hr">


    <div class="grid-container-pomodoro">

        <div class="box-blueish" style="grid-area: box-1;">

            <h1 class="pomodoro-h1" id="timer">25 : 00</h1>

            <button class="pomodoro-button" id="start">Start</button>
            <button class="pomodoro-button" id="reset" >New Timer</button>
            <button class="pomodoro-button" id="stop">Stop</button>
        </div>

    </div>
    <script src="pomodoro.js"></script>


</body>


</html>
