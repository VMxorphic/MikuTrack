<!DOCTYPE html>
<html lang="en">
<head>
    
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro</title>
</head>


<body>

    <div class="grid-container-music">
        <div class="box-black" style="grid-area: box-2;">
            <img src="images/ui/mikuiconmusic.jpg" alt="Miku Music Icon" class="miku-music-icon">
        </div>
    </div>



    <div class="thick-line">
        <button  class="main-button" id="pomodoro-button" href="index.html">Pomodoro</button>
        <button  class="main-button" id="music-button" href="music.html">Music</button>
        <button  class="main-button" id="tasks-button" href="tasks.html">Tasks</button>
    </div>
    


    <div class="grid-container-pomodoro">

        <div class="box-blueish" style="grid-area: box-1;">

            <h1 class="pomodoro-h1" id="timer">25 : 00</h1>

            <button class="pomodoro-button" id="start">Start</button>
            <button class="pomodoro-button" id="reset" >New Timer</button>
            <button class="pomodoro-button" id="stop">Stop</button>
        </div>

    </div>
    
    <script src="pomodoro.js"></script>


</body>

</html>
